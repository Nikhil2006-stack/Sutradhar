services:
  - type: web
    name: sutradhar-platform
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: AUTO_SEED_DEMO_DATA
        value: "true"
      - key: AI_PROVIDER
        value: "deterministic"
      - key: JWT_SECRET_KEY
        generateValue: true

