name: Sutradhar CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      deploy_to_production:
        description: "Trigger production cloud deployment after CI passes"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  backend-ci:
    name: Backend Lint & Pytest Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sutradhar_test
          POSTGRES_PASSWORD: sutradhar_test_password
          POSTGRES_DB: sutradhar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic Database Migrations Check
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+psycopg://sutradhar_test:sutradhar_test_password@localhost:5432/sutradhar_test
          SECRET_KEY: ci-test-secret-key-at-least-32-chars-long-2026
        run: |
          alembic upgrade head

      - name: Run Backend Pytest Suite (Unit, API, RBAC, Multi-Tenant, AI)
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+psycopg://sutradhar_test:sutradhar_test_password@localhost:5432/sutradhar_test
          SECRET_KEY: ci-test-secret-key-at-least-32-chars-long-2026
          STORAGE_BACKEND: local
        run: |
          pytest -v --tb=short

  frontend-ci:
    name: Frontend Typecheck, Tests & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Run TypeScript Typecheck
        working-directory: ./frontend
        run: npm run typecheck

      - name: Run Frontend Unit & Component Tests
        working-directory: ./frontend
        run: npm run test -- --run

      - name: Build Production Bundle
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'http://localhost:8000/api/v1' }}
        run: npm run build

  docker-verification:
    name: Verify Docker Images Build
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: docker build -t sutradhar-backend:ci ./backend

      - name: Build Frontend Docker Image
        run: docker build -t sutradhar-frontend:ci ./frontend

  deploy:
    name: Authorised Cloud Deployment
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, docker-verification]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_to_production == 'true'

    steps:
      - name: Trigger Backend Deployment Webhook
        if: env.DEPLOY_WEBHOOK_BACKEND != ''
        env:
          DEPLOY_WEBHOOK_BACKEND: ${{ secrets.DEPLOY_WEBHOOK_BACKEND }}
        run: |
          curl -f -X POST "$DEPLOY_WEBHOOK_BACKEND"

      - name: Trigger Frontend Deployment Webhook
        if: env.DEPLOY_WEBHOOK_FRONTEND != ''
        env:
          DEPLOY_WEBHOOK_FRONTEND: ${{ secrets.DEPLOY_WEBHOOK_FRONTEND }}
        run: |
          curl -f -X POST "$DEPLOY_WEBHOOK_FRONTEND"

